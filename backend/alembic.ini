[alembic]
script_location = alembic
prepend_sys_path = .
# prepend_sys_path などを区切る文字。書かないと空白・カンマ・コロンで区切る旧来の読み方に
# なり、Alembic 1.16 以降は非推奨の警告が出る。os は OS の区切り（: か ;）に従う
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
