[project]
name = "netvision-backend"
version = "0.1.0"
description = "NetVision - ネットワーク機器のインベントリ / 保守期限 / ライフサイクル管理 API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dateutil>=2.9",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    # Windows には zoneinfo のデータベースが無い。入れておかないと
    # ZoneInfo("Asia/Tokyo") が失敗し、黙って UTC 表示に戻る
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI の Depends() / Query() を引数デフォルトに置くのは規定の書き方
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# SKIP_SCHEMA を Settings 読み込みより前に置く必要がある
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
