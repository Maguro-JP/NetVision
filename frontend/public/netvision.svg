<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- NetVision のアイコン。黒い角丸の板に、網の目（3 台の機器と結線）と、それを見る瞳の輪を重ねる -->
  <defs>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#e3261f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a1a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#111111"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#2a2a2a" stroke-width="4"/>
  <circle cx="128" cy="128" r="96" fill="url(#glow)"/>
  <circle cx="128" cy="128" r="78" fill="none" stroke="url(#hot)" stroke-width="10"/>
  <circle cx="128" cy="128" r="58" fill="none" stroke="#f5f5f5" stroke-width="3" stroke-dasharray="6 9" opacity="0.55"/>
  <g stroke="#f5f5f5" stroke-width="7" stroke-linecap="round">
    <line x1="128" y1="92" x2="96" y2="150"/>
    <line x1="128" y1="92" x2="160" y2="150"/>
    <line x1="96" y1="150" x2="160" y2="150"/>
  </g>
  <circle cx="128" cy="92" r="15" fill="url(#hot)" stroke="#f5f5f5" stroke-width="5"/>
  <circle cx="96" cy="150" r="13" fill="#f5f5f5"/>
  <circle cx="160" cy="150" r="13" fill="#f5f5f5"/>
  <circle cx="128" cy="131" r="6" fill="url(#hot)"/>
</svg>
