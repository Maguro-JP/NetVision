<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- NetVision のアイコン。夜空のような黒い板に、機器 3 台の結線と、それを見渡す軌道の輪を描く -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262b"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d3a"/>
      <stop offset="0.55" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a1a" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ff3d1a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff3d1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pearl" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd2d8"/>
    </radialGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#plate)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="56.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <circle cx="128" cy="134" r="100" fill="url(#ember)"/>

  <!-- 軌道の輪: 細い全周と、光る弧 -->
  <circle cx="128" cy="128" r="76" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="128" cy="128" r="76" fill="none" stroke="url(#flame)" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="330 148" transform="rotate(118 128 128)" filter="url(#bloom)"/>
  <circle cx="163.7" cy="195.1" r="10" fill="#ff8a3d" fill-opacity="0.25"/>
  <circle cx="163.7" cy="195.1" r="4.5" fill="#ffd9a8"/>

  <!-- 結線 -->
  <g stroke="#f4f4f6" stroke-opacity="0.9" stroke-width="4.5" stroke-linecap="round">
    <line x1="128" y1="96" x2="99" y2="148"/>
    <line x1="128" y1="96" x2="157" y2="148"/>
    <line x1="99" y1="148" x2="157" y2="148"/>
  </g>

  <!-- 機器: 上の 1 台は光る核、下の 2 台は白い玉 -->
  <circle cx="128" cy="96" r="14" fill="url(#flame)" filter="url(#bloom)"/>
  <circle cx="123.5" cy="91.5" r="4" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="99" cy="148" r="11" fill="url(#pearl)"/>
  <circle cx="157" cy="148" r="11" fill="url(#pearl)"/>
</svg>
