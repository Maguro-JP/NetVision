# repo-bootstrap が置いた最小の CI。人の PR と、ci の札を付けた PR で走る。
name: test
on:
  # 本線への push では回さない。入るのは確かめ済みのものだけ。
  # 自律開発（claude/ の枝）の PR も回さない。手元で検証してからマージするので、
  # 同じものを Actions で回すと枠だけが減る。人が見てほしいときは `ci` の札を付ける
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: >-
      github.event_name != 'pull_request'
      || !startsWith(github.head_ref, 'claude/')
      || contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          pip install pytest
      - run: @@CHECKS@@
      - run: @@TEST@@
