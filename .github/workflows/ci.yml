name: CI

# 走らせる回数と、1回に使う分数の両方を絞る。private リポジトリの Actions は
# 無料枠に限りがあり、ジョブは1分未満でも1分として数えられる。だから
#
#   ・同じコミットを2度見ない（作業ブランチは PR 側だけで見る）
#   ・ジョブを分けない（分けるほど、待ち時間と端数のぶんだけ余計に数えられる）
#   ・触っていないところは動かさない（backend だけの変更で npm を入れない）
#   ・止まったまま回り続けないよう、頭打ちの時間を置く
on:
  # 本線への push では回さない。マージの前に、手元か PR で確かめ済みのものしか入らない
  workflow_dispatch:
  # 下書きのあいだは走らせない。書いている途中は手元で確かめていて、
  # ここで見てほしいのは「人に見せる形になった」ときだから。
  # ready_for_review を足しているのは、既定の種類に入っていないため
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

# 新しいコミットが来たら、古い実行は捨てる。
# 直し済みの失敗が後から届いて「CI が落ちた」と出るのを防ぐ。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 下書きは、まだ人に見せる形になっていない。
    # 自律開発（claude/ の枝）の PR は手元で検証してからマージするので回さない。
    # 人が見てほしいときは PR に `ci` の札を付ける
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.draft == false
          && (!startsWith(github.head_ref, 'claude/') || contains(github.event.pull_request.labels.*.name, 'ci')))
    runs-on: ubuntu-latest
    # 手元では backend 2分・frontend 1分ほど。詰まったまま回り続けたら止める
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # 触ったところを見るために、比べる先まで取る
          fetch-depth: 0

      # 積み上げ PR と、未マージのまま次の PR を出すことを止める。
      # ルールの本文は AGENTS.md。PR が立った時点と、下書きを外した時点だけ見る
      - name: PR の並び方を見る
        if: >-
          github.event_name == 'pull_request' &&
          contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action)
        uses: actions/github-script@v7
        with:
          script: |
            const MAINLINE = 'main';
            // 作業ブランチの付け方は道具によって変わる。増えても落ちないよう並べる
            const WORK = ['claude/', 'cursor/', 'codex/'];
            const isWork = (name) => WORK.some((prefix) => name.startsWith(prefix));
            const pr = context.payload.pull_request;
            const { base: { ref: base }, head: { ref: head }, number } = pr;
            const errors = [];

            if (isWork(head) && isWork(base)) {
              errors.push(
                `積み上げ PR は禁止です。base が \`${base}\` になっています。` +
                  `本線 \`${MAINLINE}\` へ向けてください。`
              );
            } else if (isWork(head) && base !== MAINLINE) {
              errors.push(
                `機能の PR の base は \`${MAINLINE}\` だけです。今は \`${base}\` です。`
              );
            }

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const others = openPrs.filter(
              (p) => p.number !== number && isWork(p.head.ref) && !p.draft
            );
            if (others.length > 0) {
              const list = others.map((p) => `#${p.number} （${p.head.ref}）`).join('、');
              errors.push(
                `未マージの PR が残っています: ${list}。` +
                  `新しい PR を出す前に Merge するか、その PR に変更を足してください。`
              );
            }

            if (errors.length > 0) {
              core.setFailed(errors.join('\n'));
            } else {
              core.info(`OK: #${number} ${head} → ${base}`);
            }

      # 触っていないところは動かさない。backend だけの変更で npm を入れると、
      # それだけで1分ぶん数えられる。分からないときは両方動かす（見落とすより安い）
      - id: touched
        name: どこを触ったか
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "比べる先が取れないので、両方見ます"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "$changed"
          grep -q '^backend/' <<<"$changed" && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          grep -q '^frontend/' <<<"$changed" && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        if: steps.touched.outputs.backend == 'true'
        with:
          python-version: "3.11"
          # 依存を毎回取りに行くと、そのぶん実行時間が伸びる
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: backend
        if: steps.touched.outputs.backend == 'true'
        working-directory: backend
        run: |
          # -q で導入のログを抑える。Actions のストレージはログも数える
          pip install -q -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest -q

      - uses: actions/setup-node@v7
        if: steps.touched.outputs.frontend == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend
        if: steps.touched.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          # 監査・寄付の案内・詳細ログを止める。ログもストレージを食う
          npm ci --no-audit --no-fund --loglevel=error
          npm run typecheck
          npm test
          npm run build
