name: CI

# 走らせる回数を絞る。private リポジトリの Actions は無料枠に限りがあり、
# ジョブは1分未満でも1分として数えられる。同じコミットを2度見ない。
on:
  # 作業ブランチは PR 側で見るので、push で走らせるのは本線だけにする。
  # 以前は push と pull_request の両方が走り、1回の push で2回ぶん使っていた
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

# 新しいコミットが来たら、古い実行は捨てる。
# 直し済みの失敗が後から届いて「CI が落ちた」と出るのを防ぐ。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          # 依存を毎回取りに行くと、そのぶん実行時間が伸びる
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
