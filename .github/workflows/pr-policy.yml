# 積み上げ PR と、未マージのまま次の PR を出すことを止める。
# ルールの本文は AGENTS.md。
name: PR policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

jobs:
  one-at-a-time:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MAINLINE = 'main';
            const pr = context.payload.pull_request;
            const base = pr.base.ref;
            const head = pr.head.ref;
            const number = pr.number;
            const errors = [];

            if (head.startsWith('cursor/') && base.startsWith('cursor/')) {
              errors.push(
                `積み上げ PR は禁止です。base が \`${base}\` になっています。` +
                  `本線 \`${MAINLINE}\` へ向けてください。`
              );
            } else if (head.startsWith('cursor/') && base !== MAINLINE) {
              errors.push(
                `機能の PR の base は \`${MAINLINE}\` だけです。今は \`${base}\` です。`
              );
            }

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const others = openPrs.filter(
              (p) => p.number !== number && p.head.ref.startsWith('cursor/')
            );
            if (others.length > 0) {
              const list = others
                .map((p) => `#${p.number} （${p.head.ref}）`)
                .join('、');
              errors.push(
                `未マージの PR が残っています: ${list}。` +
                  `新しい PR を出す前に Merge するか、その PR に変更を足してください。`
              );
            }

            if (errors.length > 0) {
              core.setFailed(errors.join('\n'));
            } else {
              core.info(`OK: #${number} ${head} → ${base}`);
            }
