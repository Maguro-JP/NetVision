# Windows 用の「インストール不要」ZIP を GitHub 側で作る。
#
# 作業用の端末に Git も Python も Node.js も入れられないことがある。
# その場合はここで作った ZIP をブラウザから落として、そのまま持ち込めばよい。
#
# 動かし方: GitHub の Actions タブ → この workflow → Run workflow
name: Windows bundle

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  bundle:
    runs-on: ubuntu-latest
    # リリースへの添付に要る。既定は読み取りだけ
    permissions:
      contents: write
    # 詰まったまま回り続けたら止める（無料枠は時間で減る）
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: ./packaging/make-bundle-windows.sh

      - id: find
        run: echo "zip=$(ls dist/NetVision-*-windows.zip)" >> "$GITHUB_OUTPUT"

      # 出来上がりが壊れていないか、置くだけで確かめる。
      # 起動そのものは Windows でしか試せないが、中身の欠けはここで気づける。
      - name: 中身を確かめる
        run: |
          python - "${{ steps.find.outputs.zip }}" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          need = [
              "NetVision.bat",
              "README.txt",
              "python/python.exe",
              "backend/scripts/standalone.py",
              "backend/app/main.py",
              "frontend/dist/index.html",
          ]
          missing = [n for n in need if not any(x.endswith(n) for x in names)]
          if missing:
              sys.exit(f"ZIP に足りないものがあります: {missing}")
          if not any("/lib/fastapi/" in n for n in names):
              sys.exit("依存ライブラリが入っていません")
          print(f"{len(names)} 個のファイルを確認しました")
          PY

      # リリースから走ったときは、リリースの添付ファイルとして置く。
      # 添付ファイルは Actions のストレージ枠を使わないので、ここが本命。
      - name: リリースに添付する
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.find.outputs.zip }}" --clobber

      # 手で走らせたときの受け取り口。ZIP は 1 個で約 19 MB あり、
      # Actions のストレージ枠（無料は 0.5 GB）を直に削る。落としたら
      # 用は済むので、置いておくのは 3 日で足りる
      #
      # v7 は単一ファイルをそのまま置く形に変わり、成果物の入れ子が
      # 変わる（＝手順書の記述が合わなくなる）。ここで変えたいのは
      # Node 20 の非推奨警告を消すことだけなので、同じ node24 で
      # 挙動の変わらない v6 に留める
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'release'
        with:
          name: NetVision-windows
          path: dist/NetVision-*-windows.zip
          retention-days: 3
